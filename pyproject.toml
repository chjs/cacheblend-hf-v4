[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheblend"
version = "0.4.0"
description = "CacheBlend HF v4 — quality-only milestone with gradual filtering discovery"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU",
    "slow: > 60s",
    "requires_model: needs HF model download",
]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
